name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one deploy at a time; never cancel a deploy that is mid-flight.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # CI 1 — PHP lint (Pint) + tests (phpunit uses sqlite :memory:, see phpunit.xml)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, gd, zip, exif, pcntl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  # ---------------------------------------------------------------------------
  # CI 2 — front-end build (validates Vite / Tailwind compile)
  # ---------------------------------------------------------------------------
  build-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

  # ---------------------------------------------------------------------------
  # CI 3 — Docker image builds (catches Dockerfile breakage before merge)
  # ---------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build image (validation only, not pushed)
        run: docker build -t website-app:ci .

  # ---------------------------------------------------------------------------
  # CD — deploy on the laptop via a self-hosted runner.
  # Runs only on push to main, after all CI jobs pass.
  # Requires repo secrets: APP_DOMAIN, CLOUDFLARE_TUNNEL_TOKEN, APP_KEY,
  #                        MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD
  # ---------------------------------------------------------------------------
  deploy:
    needs: [test, build-assets, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Pin the compose project so it reuses the SAME volumes (db_data,
      # storage_data) as a manual `docker compose` run from a folder named
      # "website-app". Change this only if your manual folder has another name.
      COMPOSE_PROJECT_NAME: website-app
    # Windows self-hosted runner -> use Windows PowerShell for every step
    # (it is always present; `bash` on Windows may resolve to WSL and mangle paths).
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Write .env from secrets
        env:
          SECRET_APP_KEY: ${{ secrets.APP_KEY }}
          SECRET_APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          SECRET_CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SECRET_MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          SECRET_MYSQL_USER: ${{ secrets.MYSQL_USER }}
          SECRET_MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          SECRET_MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          Copy-Item .env.docker .env -Force
          Add-Content .env "" -Encoding ascii
          Add-Content .env "# ---- injected by GitHub Actions (deploy job) ----" -Encoding ascii
          foreach ($k in 'APP_KEY','APP_DOMAIN','CLOUDFLARE_TUNNEL_TOKEN','MYSQL_DATABASE','MYSQL_USER','MYSQL_PASSWORD','MYSQL_ROOT_PASSWORD') {
            $v = [Environment]::GetEnvironmentVariable("SECRET_$k")
            Add-Content .env "$k=$v" -Encoding ascii
          }

      - name: Sanity-check compose config
        run: docker compose config | Out-Null

      - name: Build and start stack
        run: |
          docker compose up -d --build --remove-orphans
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose ps

      - name: Wait for app to be healthy
        run: |
          for ($i = 1; $i -le 40; $i++) {
            docker compose exec -T app curl -fsS -o /dev/null http://localhost/up
            if ($LASTEXITCODE -eq 0) { Write-Host "app is responding"; exit 0 }
            Write-Host "waiting for app... ($i/40)"
            Start-Sleep -Seconds 3
          }
          Write-Host "::error::app did not respond in time"
          docker compose logs --tail=120 app
          exit 1

      - name: Check Cloudflare tunnel is connected
        run: |
          $logs = docker compose logs --tail=200 cloudflared | Out-String
          if ($logs -match "Registered tunnel connection") {
            Write-Host "tunnel connected"
          } else {
            Write-Host "::warning::did not see 'Registered tunnel connection' in recent logs - check: docker compose logs cloudflared"
          }

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
