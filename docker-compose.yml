services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-stylehub}
      DB_USERNAME: ${MYSQL_USER:-stylehub}
      DB_PASSWORD: ${MYSQL_PASSWORD:-stylehub}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stylehub}
      MYSQL_USER: ${MYSQL_USER:-stylehub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stylehub}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stylehub_root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-stylehub_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  storage_data:
