services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-stylehub}
      DB_USERNAME: ${MYSQL_USER:-stylehub}
      DB_PASSWORD: ${MYSQL_PASSWORD:-stylehub}
      # Public URL the site is served on (via Cloudflare Tunnel). Set APP_DOMAIN in .env
      APP_URL: https://${APP_DOMAIN:-localhost:8082}
      # Stable key across rebuilds for CI/CD. If empty, the app falls back to the
      # key baked into the image at build time (which changes every rebuild and
      # would log everyone out). Set APP_KEY in .env / GitHub secret. See CI-CD.md
      APP_KEY: ${APP_KEY:-}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stylehub}
      MYSQL_USER: ${MYSQL_USER:-stylehub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stylehub}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stylehub_root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-stylehub_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cloudflare Tunnel: exposes the app on your domain over HTTPS with no open ports.
  # Token lives in .env as CLOUDFLARE_TUNNEL_TOKEN (never commit it).
  # In the Cloudflare Zero Trust dashboard, point the tunnel's Public Hostname
  # (your domain) at the service  http://app:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - app

volumes:
  db_data:
  storage_data:
